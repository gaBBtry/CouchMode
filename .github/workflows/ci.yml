name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          xcodebuild \
            -project CouchMode.xcodeproj \
            -scheme CouchMode \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CouchModeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
